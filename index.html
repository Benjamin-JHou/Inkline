<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8f3" />
  <meta name="description" content="Inkline — a writing desk between ink and paper. Write Markdown locally, preview live, export to Markdown / PDF / HTML in one tap." />
  <title>Inkline · Writing Desk</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Inkline" />

  <link rel="stylesheet" href="vendor/highlight-light.css" id="hljs-light" />
  <link rel="stylesheet" href="vendor/highlight-dark.css" id="hljs-dark" disabled />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="print.css" media="print" />
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand" title="Inkline">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M8 24c0-8 4-16 12-16 0 8-4 16-12 16z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8 24l6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Inkline</span>
    </div>

    <div class="tabs" role="tablist" aria-label="View">
      <button class="tab is-active" data-view="write" data-i18n="tab_write" role="tab" aria-selected="true">Write</button>
      <button class="tab" data-view="read" data-i18n="tab_preview" role="tab" aria-selected="false">Preview</button>
    </div>

    <div class="actions">
      <input type="file" id="file-input" accept="text/plain,text/markdown,.md,.markdown,.txt" hidden />
      <button class="btn ghost" id="btn-lang" data-i18n-title="lang_title" title="切换语言 / Switch language" aria-label="Switch language">
        <span id="lang-label">中</span>
      </button>
      <button class="btn ghost" id="btn-theme" data-i18n-title="theme_title" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn primary" id="btn-import" data-i18n-title="import_title" title="Open .md file" aria-label="Open Markdown file">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="18" x2="12" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polyline points="9 15 12 12 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="import">Import</span>
      </button>
      <div class="menu">
        <button class="btn primary" id="btn-export" data-i18n="export" aria-haspopup="true" aria-expanded="false">Export</button>
        <div class="menu-list" id="export-menu" role="menu" hidden>
          <button role="menuitem" id="menu-import" data-i18n="import_menu" class="menu-import-item">Import .md</button>
          <hr class="menu-divider" />
          <button role="menuitem" data-export="md" data-i18n="export_md">Markdown (.md)</button>
          <button role="menuitem" data-export="html" data-i18n="export_html">HTML (single file)</button>
          <button role="menuitem" data-export="pdf" data-i18n="export_pdf">PDF (print)</button>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace" data-mode="write">
    <section class="pane pane-editor" aria-label="Editor">
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
        data-i18n-placeholder="placeholder"
        placeholder="# Start writing here&#10;&#10;Supports **Markdown**, `code`, tables, task lists…&#10;Everything you type is saved locally."></textarea>
    </section>
    <div class="divider" aria-hidden="true"></div>
    <section class="pane pane-preview" aria-label="Preview">
      <article id="preview" class="prose"></article>
    </section>
  </main>

  <footer class="statusbar" role="contentinfo">
    <span id="stat-words">0 words</span>
    <span class="dot">·</span>
    <span id="stat-saved" data-i18n="saved">Saved</span>
    <span class="spacer"></span>
    <span class="hint" id="stat-install"></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
